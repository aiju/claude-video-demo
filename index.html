<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Token</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@500;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&text=%E7%8C%AB%E3%81%AD%E3%81%93%E7%8A%AC%E6%98%9F&display=swap">
<style>
  /* Layout: one 16:9 stage letterboxed on black, controls float over its bottom edge. */
  :root {
    --bg: #000000;
    --ink: #e9f6ff;
    --muted: #8aa3b8;
    --accent: #19e6ff;
    --hot: #ff2d95;
    --panel: rgba(8, 6, 18, 0.72);
    --display: "Unbounded", "JetBrains Mono", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--mono);
    display: grid; place-items: center; overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  body.render-mode { display: block; padding: 0; }
  #stage { display: block; position: fixed; inset: 0; margin: auto; background: #000; }
  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 55%, rgba(25, 230, 255, 0.10), rgba(0, 0, 0, 0.82) 60%);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .card { display: grid; gap: 18px; justify-items: center; max-width: 40rem; }
  .eyebrow { font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); }
  h1 {
    font-family: var(--display); font-weight: 800; margin: 0; line-height: 0.95; text-wrap: balance;
    font-size: clamp(40px, 9vw, 104px); letter-spacing: -0.02em;
    background: linear-gradient(100deg, #ffffff 10%, var(--accent) 45%, var(--hot) 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(25, 230, 255, 0.35));
  }
  .sub { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0; max-width: 34rem; }
  .sub b { color: var(--ink); font-weight: 700; }
  button {
    font: inherit; color: var(--ink); background: transparent; border: 1px solid rgba(233, 246, 255, 0.25);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #play-btn {
    font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 14px 34px; border: 1px solid var(--accent); color: #001014; background: var(--accent);
    box-shadow: 0 0 32px rgba(25, 230, 255, 0.55), inset 0 0 12px rgba(255, 255, 255, 0.6);
  }
  #play-btn:disabled { background: transparent; color: var(--muted); border-color: rgba(233, 246, 255, 0.2); box-shadow: none; cursor: progress; }
  #status { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; min-height: 1.2em; font-variant-numeric: tabular-nums; }
  .keys { font-size: 11px; color: var(--muted); opacity: 0.8; line-height: 1.8; }
  kbd { font-family: var(--mono); border: 1px solid rgba(233, 246, 255, 0.2); border-radius: 4px; padding: 0 5px; color: var(--ink); }

  #controls {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); transition: opacity 0.4s;
    font-size: 12px; box-sizing: border-box;
  }
  body.idle #controls, body.clean #controls { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 7.5em; text-align: center; }
  .track { position: relative; flex: 1; min-width: 0; height: 24px; display: flex; align-items: center; }
  #scrub { width: 100%; margin: 0; accent-color: var(--accent); }
  #marks { position: absolute; inset: 0; pointer-events: none; }
  .mark {
    position: absolute; top: 0; width: 10px; height: 8px; padding: 0; border: 0; border-radius: 2px; transform: translateX(-50%);
    background: var(--hot); opacity: 0.8; pointer-events: auto;
  }
  #error { position: fixed; inset: auto 16px 16px; padding: 12px 16px; background: #2a0010; color: #ffd6e4; border: 1px solid var(--hot); border-radius: 8px; }
  @media (max-width: 560px) { .keys, #full { display: none; } #controls { gap: 8px; } }
  @media (prefers-reduced-motion: reduce) { #controls { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Animated visualisation of a language model generating its next token"></canvas>

<div id="start" class="overlay">
  <div class="card">
    <div class="eyebrow">60 seconds · inside a language model</div>
    <h1>Next Token</h1>
    <p class="sub">Typing, tokens, embeddings, attention, 32 layers and a spin of the sampling wheel. Every frame and every sound is <b>generated live</b> in your browser.</p>
    <button id="play-btn" type="button" disabled>Play</button>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="keys"><kbd>space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> skip a bar · <kbd>1</kbd>–<kbd>7</kbd> chapters · <kbd>f</kbd> fullscreen · <kbd>h</kbd> hide UI</div>
  </div>
</div>

<div id="controls" hidden>
  <button id="toggle" type="button" aria-label="Pause">Pause</button>
  <span id="time">0:00 / 1:00</span>
  <div class="track">
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
    <div id="marks"></div>
  </div>
  <button id="mute" type="button" aria-pressed="false">Sound on</button>
  <button id="full" type="button">Fullscreen</button>
</div>
<div id="error" hidden></div>

<script src="src/math.js"></script>
<script src="src/gl.js"></script>
<script src="src/text.js"></script>
<script src="src/render.js"></script>
<script src="src/score.js"></script>
<script src="src/audio.js"></script>
<script src="src/scenes/common.js"></script>
<script src="src/scenes/s1_tokens.js"></script>
<script src="src/scenes/s2_galaxy.js"></script>
<script src="src/scenes/s3_attention.js"></script>
<script src="src/scenes/s4_layers.js"></script>
<script src="src/scenes/s5_logits.js"></script>
<script src="src/scenes/s6_generate.js"></script>
<script src="src/scenes/director.js"></script>
<script src="src/main.js"></script>
</body>
</html>
